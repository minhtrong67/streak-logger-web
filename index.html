    <title>Streak Logger | minhtrong67</title>

    <!--
      Áp dụng giao diện sáng/tối, cỡ chữ và manifest TRƯỚC khi trình duyệt vẽ khung hình đầu tiên.
      Màn hình chờ (#boot) dùng đúng màu nền của ứng dụng ở từng giao diện, nên khi mở PWA
      không có bước nháy màu lạ giữa splash của hệ điều hành, màn hình chờ và giao diện chính.
    -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("streak-logger:theme") || "system";
          var isDark =
            theme === "dark" ||
            (theme === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          if (isDark) root.classList.add("dark");
          var size = localStorage.getItem("streak-logger:fontSize") || "md";
          root.style.fontSize = { sm: "15px", md: "16px", lg: "18px" }[size] || "16px";
          // Ghi đè theme-color theo lựa chọn trong ứng dụng (có thể khác giao diện hệ thống).
          var color = isDark ? "#09090b" : "#ffffff";
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < metas.length; i++) {
            metas[i].removeAttribute("media");
            metas[i].setAttribute("content", color);
          }
          var manifest = document.getElementById("app-manifest");
          if (manifest && isDark) manifest.setAttribute("href", "/manifest-dark.webmanifest");
        } catch (e) {}
      })();
    </script>

    <!-- CSS tối thiểu để nền đúng màu ngay từ khung hình đầu tiên, trước khi CSS chính tải xong. -->
    <style>
      html { background: #ffffff; color-scheme: light; }
      html.dark { background: #09090b; color-scheme: dark; }
      body { margin: 0; background: inherit; }
      #boot {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: #ffffff;
      }
      html.dark #boot { background: #09090b; }
      #boot img { width: 72px; height: 72px; border-radius: 16px; animation: boot-pulse 1.6s ease-in-out infinite; }
      @keyframes boot-pulse { 0%,100% { opacity: 1; } 50% { opacity: .55; } }
      @media (prefers-reduced-motion: reduce) { #boot img { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Màn hình chờ hiển thị trong lúc tải JavaScript, cùng màu nền với giao diện đang dùng. -->
      <div id="boot"><img src="/icons/icon-192.png" alt="Streak Logger" /></div>
    </div>
